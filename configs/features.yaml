questions:
  airborne:
    label: AIRBORNE
    definition: was the infection acquired due to inhalation of cells, aerosols or droplets in the air?
    question: 'In this abstract, is the following claim explicitly reported about the named species in the human
      disease context: “human infection with the named species is reported to have been acquired by inhaling infectious
      cells, aerosols, or droplets”?'
    question_claim: human infection with the named species is reported to have been acquired by inhaling infectious
      cells, aerosols, or droplets
    inclusion_examples:
    - 'Example inclusion (schematic): The abstract explicitly reports: “human infection with the named species is
      reported to have been acquired by inhaling infectious cells, aerosols, or droplets.”'
    exclusion_examples:
    - 'Example exclusion (schematic): The abstract mentions airborne only as background, or only for another organism
      or a non-human setting, without explicitly reporting it for the named species in human disease.'
    dimension_id: transmission
    dimension: Transmission
    category_id: transmission_routes
    category: Transmission routes
    feature_id: airborne
    scope: pathogen_host_pair
    question_version: human-feature-v1
    applicability:
      host_traits:
        all_of:
        - host:human
      pathogen_traits:
        any_of:
        - pathogen_group:bacteria
        - pathogen_group:fungi
        - pathogen_group:viruses
        - pathogen_group:oomycetes
        - pathogen_group:parasites
    answer_type: noul
