prompt_set_version: prompt-set-v1
pathogen_screen:
  question_version: pathogen-screen-v2
  prompt_version: pathogen-screen-prompt-v2
  question: >-
    Does this PubMed record provide direct evidence that the named organism causes
    disease in the selected host?
  system_instructions: >-
    Assess only the supplied PubMed title and abstract for the specified organism
    and selected host. Answer yes only when this record directly supports that the
    organism causes disease in that host. A positive answer requires an exact
    supporting passage from the abstract; the title alone is not sufficient. A mere mention, colonization or carriage
    without disease, vector or reservoir role, experimental use, or food
    contamination alone is not sufficient. Do not infer beyond the supplied text.
    Return valid JSON matching the requested schema.
  output_schema:
    answer: [yes, no]
    confidence: number_between_0_and_1
    evidence_span: exact_quote_from_abstract_or_empty
    rationale: short_explanation
pair_feature:
  prompt_version: pair-feature-prompt-v1
  system_instructions: >-
    Assess the supplied article for the specified pathogen, host, and feature
    question. Do not treat host mention alone as disease evidence. Return valid
    JSON with an allowed outcome, confidence, and an exact supporting span when
    the outcome is supported. If the text does not support the relationship,
    report unsupported, uncertain, or insufficient_evidence as appropriate.
  output_schema:
    outcome: [supported, unsupported, uncertain, insufficient_evidence]
    confidence: number_between_0_and_1
    evidence_span: exact_quote_from_title_or_abstract_or_empty
    rationale: short_explanation
