project:
  id: pathogen-atlas-v4
  schema_version: 1
run:
  run_id: pilot-v1
  config_version: pilot-config-v1
  selection_mode: full
  selection_seed: v4-pilot-v1
  host_ids:
  - ncbi:4530
  pathogen_ids: []
  pair_generation: cartesian_product
  pathogen_groups:
  - viruses
taxonomy:
  host_source: ncbi_taxonomy
  host_release_manifest: data/source_taxonomy/ncbi/source_manifest.json
  pathogen_taxonomy_release: NCBI Taxonomy 2026-11-02T10:25:03.135518+00:00 sha256:f278697a8ba610bd415eab3bd409afb9bd5dda6326b14d5430ce03580e072a0a
  pathogen_group_taxon_roots: {}
features:
  catalogue: configs/features.yaml
  profile_version: host-aware-profile-v1
acquisition:
  query_strategy_version: pathogen-host-vetted-aliases-title-abstract-v2
  pathogen_literature_query_version: pathogen-vetted-aliases-title-abstract-v2
  relationship_context: disease
  sampling:
    max_pmids_per_pair: 200
    oldest_pmids_per_pair: 30
    random_seed: 42
    sample_policy_version: stable-prefix-hash-v1
decisions:
  model_version: typesafe/jev-1.14
  screen_pathogen_pairs: true
  prompt_catalogue: configs/prompts.yaml
  prompt_set_version: system1-prompt-set-v2
  pathogen_screen_question_version: pathogen-screen-system1-v1
  pathogen_screen_prompt_version: pathogen-screen-noul-v1
  pair_feature_prompt_version: pair-feature-noul-v1
  gate_question_version: pathogen-host-disease-gate-v1
  outcomes:
  - supported
  - unsupported
  - uncertain
  - insufficient_evidence
logging:
  progress_every: 25
  save_checkpoint_every: 100
  max_attempts: 2
  decision_workers: 1024
  decision_checkpoint_every: 1000
