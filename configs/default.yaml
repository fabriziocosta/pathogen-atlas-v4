project:
  id: pathogen-atlas-v4
  schema_version: 1
run:
  config_version: v4-run-v1
  run_id: pilot-v1
  host_ids: []
  pathogen_ids: []
  pair_generation: explicit_pairs
taxonomy:
  host_source: ncbi_taxonomy
  host_release_manifest: data/source_taxonomy/ncbi/source_manifest.json
features:
  catalogue: configs/features.yaml
  profile_version: host-aware-profile-v1
acquisition:
  query_strategy_version: pathogen-host-title-abstract-v1
  pathogen_literature_query_version: pathogen-title-abstract-v1
  relationship_context: disease
  sampling:
    max_pmids_per_pair: 200
    oldest_pmids_per_pair: 30
    random_seed: 42
    sample_policy_version: stable-prefix-hash-v1
decisions:
  prompt_catalogue: configs/prompts.yaml
  prompt_set_version: prompt-set-v1
  pathogen_screen_question_version: pathogen-screen-v2
  pathogen_screen_prompt_version: pathogen-screen-prompt-v2
  pair_feature_prompt_version: pair-feature-prompt-v1
  gate_question_version: pathogen-host-disease-gate-v1
  model_version: configured-per-run
  outcome_labels: [supported, unsupported, uncertain, insufficient_evidence]
paths:
  data_root: data
