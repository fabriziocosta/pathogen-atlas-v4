project:
  id: pathogen-atlas-v4
  schema_version: 1
run:
  run_id: pilot-v1
  config_version: pilot-config-v2
  selection_mode: full
  selection_seed: v4-pilot-v1
  host_ids:
  - ncbi:4530
  pathogen_ids: []
  pair_generation: cartesian_product
  pathogen_groups:
  - viruses
taxonomy:
  host_source: ncbi_taxonomy
  host_release_manifest: data/source_taxonomy/ncbi/source_manifest.json
features:
  catalogue: configs/features.yaml
  profile_version: v4-feature-profile-2.0.2
acquisition:
  query_strategy_version: pathogen-host-batched-expanded-host-mentions-mesh-title-abstract-v4
  pathogen_literature_query_version: pathogen-vetted-aliases-title-abstract-v2
  host_expansion_enabled: true
  host_expansion_model: gpt-6.1-terra
  host_expansion_prompt_version: host-mention-expansion-v1
  host_expansion_hash: ""
  host_search_expansions: {}
  relationship_context: disease
  sampling:
    max_pmids_per_pair: 200
    oldest_pmids_per_pair: 30
    random_seed: 42
    sample_policy_version: stable-prefix-hash-v1
decisions:
  model_version: typesafe/jev-1.14
  prompt_catalogue: configs/prompts.yaml
  prompt_set_version: system1-prompt-set-v2
  pathogen_screen_question_version: pathogen-screen-system1-v2-threshold-0.7
  pathogen_screen_prompt_version: pathogen-screen-noul-v1
  pair_feature_prompt_version: pair-feature-noul-v1
  gate_question_version: pathogen-screen-system1-v2-threshold-0.7
  outcomes:
  - supported
  - unsupported
logging:
  progress_every: 25
  save_checkpoint_every: 1
  max_attempts: 2
