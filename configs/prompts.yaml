prompt_set_version: system1-prompt-set-v2
pathogen_screen:
  question_version: pathogen-screen-system1-v2-threshold-0.7
  prompt_version: pathogen-screen-noul-v1
  type: noul
  instructions: >-
    Does `article.abstract` directly establish that `pathogen.name` causes disease
    in `host.name`? Assess only this abstract and the named pathogen–host pair.
    Do not count a title-only match, a mere mention,
    colonization or carriage without disease, a vector or reservoir role,
    experimental use, or food contamination alone. Do not infer beyond the text.
  criteria:
    "true": The abstract directly supports disease caused by this named organism in this selected host.
    "false": The abstract does not directly support that exact pathogen–host disease relationship.
pair_feature:
  prompt_version: pair-feature-noul-v1
  type: noul
  instructions: >-
    Does `article.abstract` explicitly report the claim in `feature_question` for the
    entity or entities specified by `feature_scope`? Use the title only to identify
    the article; a title alone cannot support a yes answer. For pair scope, assess
    only the stated pathogen in the stated host. Do not infer beyond the supplied text.
  criteria:
    "true": The abstract explicitly supports the feature claim for the entity or entities in scope.
    "false": The abstract does not explicitly support the feature claim for the entity or entities in scope; this is not evidence that the feature is biologically absent.
