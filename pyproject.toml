[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathogen-atlas-v4"
version = "4.0.51"
description = "Host-aware, multi-domain pathogen evidence atlas"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14.0", "PyYAML>=6.0", "requests>=2.31", "openai>=1.66"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.50"]
embedding = [
    "imste @ git+https://github.com/fabriziocosta/IteratedMinimumSpanningTree.git@0a34b643e0a33f201d2bae36c32297c5c397202e",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["pathogen_atlas_v4*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
