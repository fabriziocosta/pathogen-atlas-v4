trait_policy:
  unknown: An absent trait is unknown, not false; applicability predicates are positive-only.
  source: Group traits come from the pathogen or host taxonomy group. Additional taxon and pair traits must be curated
    and provenance-recorded.
  scope: host_group is the acquisition selector; host traits express reusable biological host types such as plant
    or animal.
