name: Deploy V4 Explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'sites/pathogen-atlas-explorer/**'
      - 'pathogen_atlas_v4/explorer_release.py'
      - 'sites/pathogen-atlas-explorer/scripts/build_v4_site_data.py'
      - 'scripts/validate_explorer_release.py'
      - 'tests/test_explorer_release_validation.py'
      - 'tests/test_dashboard_publish_wait.py'
      - 'tests/test_pair_evidence_presentation.py'
  workflow_dispatch:

concurrency:
  group: pages-v4-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install "pytest>=8.0" "pandas>=2.0" "PyYAML>=6.0"
      - name: Check release validation and Explorer rendering contracts
        run: pytest -q tests/test_version.py tests/test_profile_availability.py tests/test_pair_evidence_presentation.py tests/test_explorer_release_validation.py tests/test_dashboard_publish_wait.py

  build:
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          mkdir -p _site/assets/favicons
          mkdir -p _site/assets/fonts
          cp sites/pathogen-atlas-explorer/index.html _site/index.html
          cp sites/pathogen-atlas-explorer/explorer-data.json.gz _site/explorer-data.json.gz
          cp sites/pathogen-atlas-explorer/feature-catalog.json _site/feature-catalog.json
          cp sites/pathogen-atlas-explorer/evidence.json.gz _site/evidence.json.gz
          mkdir -p _site/taxa
          cp sites/pathogen-atlas-explorer/dist/taxa/*.json.gz _site/taxa/
          cp sites/pathogen-atlas-explorer/assets/pathogen-atlas-v4-logo.png _site/assets/pathogen-atlas-v4-logo.png
          cp sites/pathogen-atlas-explorer/assets/pathogen-atlas-v4-globe.svg _site/assets/pathogen-atlas-v4-globe.svg
          cp sites/pathogen-atlas-explorer/assets/pathogen-atlas-v4-bacterium.png _site/assets/pathogen-atlas-v4-bacterium.png
          cp sites/pathogen-atlas-explorer/assets/fonts/bootstrap-icons.woff2 _site/assets/fonts/bootstrap-icons.woff2
          cp sites/pathogen-atlas-explorer/dist/assets/favicons/*.ico _site/assets/favicons/
      - name: Validate release payload before upload
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.loads(open("pyproject.toml", "rb").read().decode())["project"]["version"])')"
          python scripts/validate_explorer_release.py --site-root _site --expected-version "$VERSION"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    permissions:
      deployments: write
      pages: write
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 12
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - name: Verify live Pages release
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.loads(open("pyproject.toml", "rb").read().decode())["project"]["version"])')"
          python scripts/validate_explorer_release.py --url "$PAGES_URL" --expected-version "$VERSION"
