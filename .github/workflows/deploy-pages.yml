name: Deploy V4 Explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'sites/pathogen-atlas-explorer/**'
  workflow_dispatch:
    inputs:
      run_fast_tests:
        description: Run the fast non-visual version check before deploying
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_fast_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fast test dependency
        run: python -m pip install "pytest>=8.0"
      - name: Check package and displayed versions
        run: pytest -q tests/test_version.py tests/test_profile_availability.py tests/test_pair_evidence_presentation.py

  build:
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          mkdir -p _site/assets/favicons
          mkdir -p _site/assets/fonts
          cp sites/pathogen-atlas-explorer/index.html _site/index.html
          cp sites/pathogen-atlas-explorer/explorer-data.json.gz _site/explorer-data.json.gz
          cp sites/pathogen-atlas-explorer/feature-catalog.json _site/feature-catalog.json
          cp sites/pathogen-atlas-explorer/evidence.json.gz _site/evidence.json.gz
          mkdir -p _site/taxa
          cp sites/pathogen-atlas-explorer/dist/taxa/*.json.gz _site/taxa/
          cp sites/pathogen-atlas-explorer/assets/pathogen-atlas-v4-logo.png _site/assets/pathogen-atlas-v4-logo.png
          cp sites/pathogen-atlas-explorer/assets/pathogen-atlas-v4-globe.svg _site/assets/pathogen-atlas-v4-globe.svg
          cp sites/pathogen-atlas-explorer/assets/pathogen-atlas-v4-bacterium.png _site/assets/pathogen-atlas-v4-bacterium.png
          cp sites/pathogen-atlas-explorer/assets/fonts/bootstrap-icons.woff2 _site/assets/fonts/bootstrap-icons.woff2
          cp sites/pathogen-atlas-explorer/dist/assets/favicons/*.ico _site/assets/favicons/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    concurrency:
      group: pages-v4
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    permissions:
      deployments: write
      pages: write
      id-token: write
    steps:
      - name: Cancel stale GitHub Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'github-pages',
              per_page: 10,
            });
            const statuses = await Promise.all(deployments.map(async deployment => {
              try {
                const { data: status } = await github.request(
                  'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pages_deployment_id: deployment.sha,
                  },
                );
                return { sha: deployment.sha, status: status.status };
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }));
            for (const stale of statuses.filter(item => item && ['updating_pages', 'deployment_in_progress'].includes(item.status))) {
              core.warning(`Cancelling stale Pages deployment ${stale.sha} (${stale.status}).`);
              await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pages_deployment_id: stale.sha,
                },
              );
            }
      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 3
        uses: actions/deploy-pages@v4
        with:
          timeout: 150000
