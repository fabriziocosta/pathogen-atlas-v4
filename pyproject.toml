[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathogen-atlas-v4"
version = "4.0.134"
description = "Host-aware, multi-domain pathogen evidence atlas"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14.0", "PyYAML>=6.0", "requests>=2.31", "openai>=1.66"]

[project.scripts]
pathogen-atlas-v4-dashboard = "pathogen_atlas_v4.dashboard:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.50"]
dashboard = ["ipykernel>=6.29", "matplotlib>=3.7", "ipywidgets>=8.1", "jupyter_client>=8.6", "nbclient>=0.10", "nbformat>=5.9", "plotly>=5.24"]
embedding = [
    "imste @ git+https://github.com/fabriziocosta/IteratedMinimumSpanningTree.git@0a34b643e0a33f201d2bae36c32297c5c397202e",
    "scikit-learn>=1.3",
    "umap-learn>=0.5.5",
]

[tool.setuptools.packages.find]
include = ["pathogen_atlas_v4*"]

[tool.setuptools.package-data]
pathogen_atlas_v4 = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
